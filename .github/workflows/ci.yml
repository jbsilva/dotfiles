name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Catches drift from upstream (nixpkgs, plugin repos) rather than from a push.
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # Secrets. Runs first and on full history, because this repo has ~/.config
  # symlinked into it and is the one failure that actually matters.
  # ---------------------------------------------------------------------------
  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # gitleaks needs the whole history, not just the tip commit.
          fetch-depth: 0
          persist-credentials: false

      - uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22

      - name: gitleaks (full history)
        run: |
          nix run nixpkgs#gitleaks -- git \
            --config .gitleaks.toml \
            --no-banner --redact --verbose

  # ---------------------------------------------------------------------------
  # Formatting and linting, via the same hooks that run on commit.
  #
  # One job rather than a step per tool: prek reads .pre-commit-config.yaml, so
  # CI and the local hooks can never drift apart.
  # ---------------------------------------------------------------------------
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22

      - name: prek run --all-files
        # The `local` hooks call tools straight off $PATH, so they have to be in
        # the shell prek runs under.
        run: |
          nix shell \
            nixpkgs#prek \
            nixpkgs#nixfmt \
            nixpkgs#statix \
            nixpkgs#deadnix \
            nixpkgs#shellcheck \
            nixpkgs#zsh \
            nixpkgs#stylua \
            nixpkgs#gitleaks \
            --command prek run --all-files --show-diff-on-failure

  # ---------------------------------------------------------------------------
  # The workflow files themselves (https://docs.zizmor.sh). The zizmor hook
  # already runs in the lint job above; this job adds the two things a hook run
  # cannot do: the findings land in the Security tab, and GH_TOKEN switches on
  # the audits that query the GitHub API, so a pinned action that turns out to
  # be vulnerable fails here without anything in this repo changing.
  # ---------------------------------------------------------------------------
  workflows:
    name: Workflow audit
    runs-on: ubuntu-latest
    permissions:
      contents: read # actions/checkout
      security-events: write # upload-sarif
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22

      - name: zizmor
        run: nix run nixpkgs#zizmor -- --format=sarif . > results.sarif
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload SARIF
        # A fork PR gets a read-only token, so the upload would fail there; the
        # gate below still runs.
        if: ${{ !github.event.pull_request.head.repo.fork }}
        uses: github/codeql-action/upload-sarif@5595ccaf912efad79be6eef63a5619ff05969be3 # v4.37.6
        with:
          sarif_file: results.sarif
          category: zizmor

      - name: Fail on findings
        # --format=sarif always exits 0, so the audit runs a second time to gate
        # the PR, after the results are safely in the Security tab.
        run: nix run nixpkgs#zizmor -- .
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ---------------------------------------------------------------------------
  # Nix. Evaluated on arm64 macOS because the flake is aarch64-darwin only.
  # ---------------------------------------------------------------------------
  nix:
    name: Nix
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22

      # No binary cache here on purpose. The free Magic Nix Cache reached end of
      # life on 2025-02-01, when GitHub retired the v1 Actions cache API, and its
      # action now fails the build rather than continuing uncached. The paid
      # replacement (FlakeHub Cache) would buy nothing either: this job only
      # evaluates the configuration, it never builds a derivation, so there is
      # nothing to fetch from a cache.

      # statix/deadnix/nixfmt run in the lint job via prek; this job only does
      # what needs an aarch64-darwin runner.
      - name: Evaluate the darwin configuration
        # Full evaluation without building: catches option typos, bad module
        # arguments and broken imports in seconds instead of pulling the world.
        run: |
          nix eval --raw \
            ./nix-darwin#darwinConfigurations.M4.system.drvPath

  # ---------------------------------------------------------------------------
  # The shell config on the platforms this MacBook cannot be: WSL, Synology
  # DSM and a bare Linux with no zsh plugins installed at all.
  # ---------------------------------------------------------------------------
  shell-platforms:
    name: Shell (${{ matrix.scenario }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        scenario: [wsl, synology, bare]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Self-test in a container
        run: ./scripts/test-shell-docker.sh ${{ matrix.scenario }}

  # ---------------------------------------------------------------------------
  # Neovim: prove the lazy.nvim spec still resolves and every config module
  # loads. This is the check that would have caught the treesitter `main`
  # branch needing the tree-sitter CLI.
  # ---------------------------------------------------------------------------
  neovim:
    name: Neovim
    runs-on: ubuntu-latest
    # `require('options')`, `require('plugins.config.lsp')` and the rest resolve
    # through runtimepath, which means $XDG_CONFIG_HOME/nvim/lua. Point it at
    # this repo's .config so that is the nvim tree under test.
    #
    # This was .config-ci, a directory that does not exist, and it was set on
    # the install step only. So nothing was ever on the runtimepath and every
    # require failed -- including the ones inside init.lua.
    env:
      XDG_CONFIG_HOME: ${{ github.workspace }}/.config
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22

      - name: Install plugins
        run: |
          nix shell nixpkgs#neovim nixpkgs#tree-sitter nixpkgs#git nixpkgs#gcc \
            --command nvim --headless -u .config/nvim/init.lua "+Lazy! sync" +qa

      - name: Load every config module and check for errors
        run: |
          nix shell nixpkgs#neovim nixpkgs#tree-sitter nixpkgs#git nixpkgs#gcc --command \
            nvim --headless -u .config/nvim/init.lua \
              "+lua vim.wait(5000)" \
              "+lua
                 local failed = {}
                 for _, m in ipairs({
                   'options', 'autocmd', 'keybinds', 'mapmodes',
                   'plugins.config.lsp',
                   'plugins.config.treesitter',
                   'plugins.config.telescope',
                   'plugins.config.lualine',
                   'plugins.config.neotest',
                   'plugins.config.nvim-tree',
                 }) do
                   local ok, err = pcall(require, m)
                   if not ok then table.insert(failed, m .. ': ' .. tostring(err)) end
                 end
                 if #failed > 0 then
                   io.stderr:write('FAILED MODULES:\n' .. table.concat(failed, '\n') .. '\n')
                   vim.cmd('cquit 1')
                 end
                 print('all nvim modules loaded')" \
              +qa
